name: Elsewhere generation and compile
on:
  push:
    branches:
      - fix/elsewhere-landscape-overhaul-20261119
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate datapack and compile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon runDatagen
          ./gradlew --no-daemon build

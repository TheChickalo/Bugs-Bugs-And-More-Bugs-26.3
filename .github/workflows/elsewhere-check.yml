name: Elsewhere generation and compile
on:
  push:
    branches:
      - fix/elsewhere-landscape-overhaul-20261119
      - fix/elsewhere-hydrology-eroded-plateau-20261119
      - fix/elsewhere-surface-condition-26-3-20261119
      - fix/elsewhere-lakes-relief-volcanic-ginkgo-20261119
      - fix/elsewhere-clouds-schist-amphibolite-20261119
      - fix/elsewhere-valleys-mist-ginkgo-20261119
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reject unsupported 26.3 surface conditions
        run: |
          if grep -R -n '"minecraft:steep"' src/main/resources/data/bugsbugsandmorebugs/worldgen; then
            echo 'Unsupported minecraft:steep surface condition found'
            exit 1
          fi
      - name: Check landscape worldgen intent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          world=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen')
          surface=json.loads((world/'material_rule/elsewhere.json').read_text())
          volcanic=next(x for x in surface['sequence'] if x.get('if_true',{}).get('biome_is')=='bugsbugsandmorebugs:volcanic_peak' and x['then_run']['type']=='minecraft:sequence')
          content=json.dumps(volcanic)
          assert 'minecraft:calcite' not in content
          assert 'bugsbugsandmorebugs:schist' not in content
          lake=json.loads(Path('src/main/generated/data/bugsbugsandmorebugs/worldgen/biome/lake.json').read_text())
          assert all('bugsbugsandmorebugs:lake_pond_placed' not in step for step in lake['features'])
          for name in ['ginkgo_tree','ginkgo_old_growth']:
              tree=json.loads(Path(f'src/main/generated/data/bugsbugsandmorebugs/worldgen/feature/{name}.json').read_text())
              assert tree['trunk_placer']['type']=='minecraft:fancy_trunk_placer'
          print('Geology, lake, and Ginkgo registry assertions passed')
          PY
      - name: Verify clouds and schist-only amphibolite deposits
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('src/main/generated/data/bugsbugsandmorebugs')
          dim=json.loads((root/'dimension_type/elsewheredim_type.json').read_text())
          assert dim['attributes']['minecraft:visual/cloud_color']=='#ccffffff'
          assert dim['attributes']['minecraft:visual/cloud_height']==184
          world=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen/material_rule/elsewhere.json')
          surface=json.loads(world.read_text())
          assert 'bugsbugsandmorebugs:amphibolite' not in json.dumps(surface), 'Global amphibolite stratum must not exist'
          ore=Path('src/main/java/net/chickalo/bugsbugsandmorebugs/worldgen/feature/AmphiboliteDepositFeature.java').read_text()
          assert 'countryRock.is(ModBlocks.SCHIST)' in ore
          assert 'countryRock.is(ModBlocks.RHYOLITE)' not in ore
          assert 'countryRock.is(ModBlocks.DACITE)' not in ore
          for biome in (root/'worldgen/biome').glob('*.json'):
              values=json.loads(biome.read_text())['features']
              found=any('bugsbugsandmorebugs:amphibolite_deposit_placed' in section for section in values)
              assert found == (biome.stem != 'underhang'), str(biome)
          print('Clouds and schist-exclusive amphibolite conditions verified')
          PY
      - name: Check limestone valley and Ginkgo generation invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen')
          rule=(base/'material_rule/elsewhere.json').read_text()
          assert 'minecraft:calcite' not in rule, 'Calcite must not appear in the Elsewhere surface material rules'
          stone=json.loads((base/'density_function/stone_forest_roof.json').read_text())
          assert stone['type']=='minecraft:lerp' and stone['first']['left']['to_coordinate']<=207
          assert stone['second']['type']=='minecraft:lerp', 'Gorge floors must contain creek branches'
          density=json.loads((base/'noise_settings/elsewhere.json').read_text())
          assert 'minecraft:steep' not in json.dumps(density)
          feat=Path('src/main/generated/data/bugsbugsandmorebugs/worldgen/feature')
          for name in ('ginkgo_tree', 'ginkgo_old_growth'):
              tree=json.loads((feat/f'{name}.json').read_text())
              assert tree['trunk_placer']['type']=='minecraft:fancy_trunk_placer'
          stone_biome=json.loads(Path('src/main/generated/data/bugsbugsandmorebugs/worldgen/biome/stone_forest.json').read_text())
          assert any('bugsbugsandmorebugs:wetland_reeds_placed' in section for section in stone_biome['features'])
          print('Landscape and foliage invariants passed')
          PY
      - name: Generate datapack and compile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon runDatagen
          ./gradlew --no-daemon build

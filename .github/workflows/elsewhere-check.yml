name: Elsewhere generation and compile
on:
  push:
    branches:
      - fix/elsewhere-landscape-overhaul-20261119
      - fix/elsewhere-hydrology-eroded-plateau-20261119
      - fix/elsewhere-surface-condition-26-3-20261119
      - fix/elsewhere-lakes-relief-volcanic-ginkgo-20261119
      - fix/elsewhere-clouds-schist-amphibolite-20261119
      - fix/elsewhere-valleys-mist-ginkgo-20261119
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reject unsupported 26.3 surface conditions
        run: |
          if grep -R -n '"minecraft:steep"' src/main/resources/data/bugsbugsandmorebugs/worldgen; then
            echo 'Unsupported minecraft:steep surface condition found'
            exit 1
          fi
      - name: Check landscape worldgen intent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          world=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen')
          surface=json.loads((world/'material_rule/elsewhere.json').read_text())
          volcanic=next(x for x in surface['sequence'] if x.get('if_true',{}).get('biome_is')=='bugsbugsandmorebugs:volcanic_peak' and x['then_run']['type']=='minecraft:sequence')
          content=json.dumps(volcanic)
          assert 'minecraft:calcite' not in content
          assert 'bugsbugsandmorebugs:schist' not in content
          assert not Path('src/main/generated/data/bugsbugsandmorebugs/worldgen/biome/lake.json').exists()
          biomes=Path('src/main/java/net/chickalo/bugsbugsandmorebugs/worldgen/biome/ModBiomes.java').read_text()
          assert 'registerBiomeKey("lake")' not in biomes
          for name in ['ginkgo_tree','ginkgo_old_growth']:
              tree=json.loads(Path(f'src/main/generated/data/bugsbugsandmorebugs/worldgen/feature/{name}.json').read_text())
              assert tree['trunk_placer']['type']=='bugsbugsandmorebugs:ginkgo_trunk_placer'
          print('Geology, lake, and Ginkgo registry assertions passed')
          PY
      - name: Verify clouds and schist-only amphibolite deposits
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('src/main/generated/data/bugsbugsandmorebugs')
          dim=json.loads((root/'dimension_type/elsewheredim_type.json').read_text())
          assert dim['attributes']['minecraft:visual/cloud_color']=='#ccffffff'
          assert dim['attributes']['minecraft:visual/cloud_height']==184
          world=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen/material_rule/elsewhere.json')
          surface=json.loads(world.read_text())
          assert 'bugsbugsandmorebugs:amphibolite' not in json.dumps(surface), 'Global amphibolite stratum must not exist'
          ore=Path('src/main/java/net/chickalo/bugsbugsandmorebugs/worldgen/feature/AmphiboliteDepositFeature.java').read_text()
          assert 'countryRock.is(ModBlocks.SCHIST)' in ore
          assert 'countryRock.is(ModBlocks.RHYOLITE)' not in ore
          assert 'countryRock.is(ModBlocks.DACITE)' not in ore
          for biome in (root/'worldgen/biome').glob('*.json'):
              values=json.loads(biome.read_text())['features']
              found=any('bugsbugsandmorebugs:amphibolite_deposit_placed' in section for section in values)
              assert found == (biome.stem != 'underhang'), str(biome)
          print('Clouds and schist-exclusive amphibolite conditions verified')
          PY
      - name: Check limestone valley and Ginkgo generation invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen')
          rule=(base/'material_rule/elsewhere.json').read_text()
          assert 'minecraft:calcite' not in rule, 'Calcite must not appear in the Elsewhere surface material rules'
          stone=json.loads((base/'density_function/stone_forest_roof.json').read_text())
          assert stone['type']=='minecraft:lerp' and stone['first']['left']['to_coordinate']<=207
          assert stone['second']['type']=='minecraft:lerp', 'Gorge floors must contain creek branches'
          density=json.loads((base/'noise_settings/elsewhere.json').read_text())
          assert 'minecraft:steep' not in json.dumps(density)
          feat=Path('src/main/generated/data/bugsbugsandmorebugs/worldgen/feature')
          for name in ('ginkgo_tree', 'ginkgo_old_growth'):
              tree=json.loads((feat/f'{name}.json').read_text())
              assert tree['trunk_placer']['type']=='bugsbugsandmorebugs:ginkgo_trunk_placer'
          stone_biome=json.loads(Path('src/main/generated/data/bugsbugsandmorebugs/worldgen/biome/stone_forest.json').read_text())
          assert any('bugsbugsandmorebugs:wetland_reeds_placed' in section for section in stone_biome['features'])
          # The removed lake biome must not alter terrain or occupy climate space.
          router=density['noise_router']['final_density']['when_in_range']
          assert 'bugsbugsandmorebugs:lake_basin_region' not in json.dumps(router)
          else_dim=json.loads(Path('src/main/resources/data/bugsbugsandmorebugs/dimension/elsewheredim.json').read_text())
          climates=else_dim['generator']['biome_source']['biomes']
          assert not any(x['biome']=='bugsbugsandmorebugs:lake' for x in climates)
          assert sum(x['biome']=='bugsbugsandmorebugs:volcanic_peak' for x in climates)>=5
          assert sum(x['biome']=='bugsbugsandmorebugs:bamboo_marsh' for x in climates)>=3
          aquifer=density['aquifers']['surface_level']
          assert aquifer=='minecraft:overworld_large_biomes/preliminary_surface_level'
          assert density['sea_level']==63, 'Use vanilla sea level for river and ocean water'
          assert 'minecraft:visual/cloud_height' not in stone_biome['attributes']
          assert stone['alpha']['type']=='minecraft:max', 'Keep original valleys plus extra pillar paths'
          assert stone['alpha']['right']['type']=='minecraft:max', 'Missing narrow freestanding pillar channels'
          assert sum(x['biome']=='bugsbugsandmorebugs:snowy_peak' for x in climates)>=4
          assert sum(x['biome']=='bugsbugsandmorebugs:bamboo_lowlands' for x in climates)>=8
          assert any(isinstance(x['parameters']['temperature'],list) for x in climates if x['biome']=='bugsbugsandmorebugs:snowy_peak')
          print('Landscape, foliage, lake-removal and cloud invariants passed')
          PY
      - name: Verify ginkgo, moss and unified clouds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('src/main/generated/data/bugsbugsandmorebugs')
          trees=root/'worldgen/feature'
          tree=json.loads((trees/'ginkgo_tree.json').read_text())
          ancient=json.loads((trees/'ginkgo_old_growth.json').read_text())
          assert tree['foliage_placer']['radius']==2
          assert ancient['foliage_placer']['radius']==3
          assert tree['trunk_placer']['thick'] is False
          assert ancient['trunk_placer']['thick'] is True
          material=json.loads(Path('src/main/resources/data/bugsbugsandmorebugs/worldgen/material_rule/elsewhere.json').read_text())
          moss=[x for x in material['sequence'] if x.get('if_true',{}).get('biome_is')=='bugsbugsandmorebugs:mossy_hinoki_grove']
          assert not moss, 'Mossy Hinoki must use sparse features, not blanket surface rules'
          hinoki=json.loads((root/'worldgen/biome/mossy_hinoki_grove.json').read_text())
          assert 'bugsbugsandmorebugs:hinoki_boulder_placed' in hinoki['features'][2]
          assert (root/'worldgen/feature/hinoki_boulder.json').exists()
          for n in ('ginkgo_small','ginkgo_tree','ginkgo_old_growth'):
              data=json.loads((trees/(n+'.json')).read_text())
              assert data['trunk_placer']['type']=='bugsbugsandmorebugs:ginkgo_trunk_placer'
              assert data['foliage_placer']['type']=='bugsbugsandmorebugs:ginkgo_foliage_placer'
              assert data['foliage_placer']['canopy_layers']>=5
          for biome in (root/'worldgen/biome').glob('*.json'):
              attrs=json.loads(biome.read_text())['attributes']
              assert 'minecraft:visual/cloud_height' not in attrs, biome
          dim=json.loads(Path('src/main/resources/data/bugsbugsandmorebugs/dimension/elsewheredim.json').read_text())
          est=[x['parameters'] for x in dim['generator']['biome_source']['biomes'] if x['biome']=='bugsbugsandmorebugs:estuary']
          assert len(est)>=4, 'Coastal estuary patches must survive in the new climate atlas'
          assert all(x['continentalness']==[-0.19,-0.11] and x['weirdness']==[-0.045,0.045] for x in est)
          assert all('minecraft:visual/ambient_particles' not in json.loads(f.read_text())['attributes']
                     for f in (root/'worldgen/biome').glob('*.json') if f.stem in
                     ('stone_forest','mossy_hinoki_grove','misty_karst_fen'))
          for biome_name in ('volcanic_peak','ashen_foothills'):
              conditions=[x for x in material['sequence'] if x.get('if_true',{}).get('biome_is')==
                  'bugsbugsandmorebugs:'+biome_name]
              assert 'bugsbugsandmorebugs:ashstone' not in json.dumps(conditions)
          assert 'bugsbugsandmorebugs:ashstone' in json.dumps(material), 'Keep Sundering Horizon geology'
          print('Ginkgo branches, sparse moss boulders, quiet fog and Sundering geology verified')
          PY
      - name: Verify volcanic hot spots, lowland terrain and layered snow
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ns='bugsbugsandmorebugs:'
          root=Path('src/main/generated/data/bugsbugsandmorebugs/worldgen')
          world=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen')
          biome=lambda name:json.loads((root/'biome'/f'{name}.json').read_text())
          placed=lambda name:json.loads((root/'placed_feature'/f'{name}_placed.json').read_text())
          feat=lambda name:json.loads((root/'feature'/f'{name}.json').read_text())
          for name in ('ashen_foothills','volcanic_peak'):
              b=biome(name)
              assert ns+'alpine_snow_placed' in b['features'][10]
              assert ns+'volcanic_magma_patch_placed' in b['features'][2]
              assert ns+('volcanic_vent_foothills_placed' if name=='ashen_foothills' else 'volcanic_vent_peak_placed') in b['features'][2]
          assert ns+'alpine_snow_placed' in biome('snowy_peak')['features'][10]
          assert feat('volcanic_vent_foothills')['foothills'] is True
          assert feat('volcanic_vent_peak')['foothills'] is False
          assert feat('alpine_snow')['type']==ns+'alpine_snow'
          assert ns+'hinoki_moss_patch_placed' in biome('mossy_hinoki_grove')['features'][2]
          assert feat('hinoki_moss_patch')['type']==ns+'hinoki_moss_patch'
          assert placed('bamboo_pools_marsh')['placement'][0]=={'type':'minecraft:count','count':2}
          density=json.loads((world/'noise_settings/elsewhere.json').read_text())
          union=density['noise_router']['final_density']['when_in_range']
          assert union['type']=='minecraft:max' and union['right']==ns+'sky_island_density'
          assert union['left']['type']=='minecraft:max'
          assert union['left']['right']==ns+'snowy_peak_density'
          forest=union['left']['left']
          assert forest['type']=='minecraft:lerp'
          assert forest['alpha']==ns+'stone_forest_restoration_region'
          assert forest['second']==ns+'stone_forest_roof'
          assert forest['first']['first']=='minecraft:overworld_large_biomes/final_density'
          assert forest['first']['second']==ns+'elsewhere_inland_legacy'
          final=json.loads((world/'density_function/elsewhere_inland_legacy.json').read_text())
          assert final['alpha']==ns+'bamboo_lowland_region'
          assert (world/'density_function/bamboo_lowland_region.json').exists()
          assert final['second']['type']=='minecraft:min'
          volc=json.loads((world/'density_function/volcanic_massif_density.json').read_text())
          assert volc['left']['right']['right']['type']=='minecraft:add'
          surface=json.loads((world/'material_rule/elsewhere.json').read_text())
          for name in ('ashen_foothills','volcanic_peak','snowy_peak'):
              rules=[x for x in surface['sequence'] if x.get('if_true',{}).get('biome_is')==ns+name]
              assert rules
              assert 'minecraft:snow_block' not in json.dumps(rules), 'Static snowlines should be removed'
          climates=json.loads(Path('src/main/resources/data/bugsbugsandmorebugs/dimension/elsewheredim.json').read_text())['generator']['biome_source']['biomes']
          assert sum(x['biome']==ns+'bamboo_marsh' for x in climates)>=9
          java=Path('src/main/java/net/chickalo/bugsbugsandmorebugs/worldgen/biome/ModOverworldBiomes.java').read_text()
          assert '0x579FB9' in java, 'Grassy Plains water tint missing'
          print('Volcanic, alpine snow, bamboo marsh, lowland bias and water-color checks passed')
          PY
      - name: Verify repaired volcanos, marsh wetlands and karst aquifers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ns='bugsbugsandmorebugs:'
          world=Path('src/main/resources/data/bugsbugsandmorebugs/worldgen')
          gen=Path('src/main/generated/data/bugsbugsandmorebugs/worldgen')
          noise=json.loads((world/'noise_settings/elsewhere.json').read_text())
          union=noise['noise_router']['final_density']['when_in_range']
          assert union['type']=='minecraft:max' and union['right']==ns+'sky_island_density'
          assert union['left']['type']=='minecraft:max'
          assert union['left']['right']==ns+'snowy_peak_density'
          forest=union['left']['left']
          assert forest['type']=='minecraft:lerp'
          assert forest['alpha']==ns+'stone_forest_restoration_region'
          assert forest['second']==ns+'stone_forest_roof'
          assert forest['first']['first']=='minecraft:overworld_large_biomes/final_density'
          root=json.loads((world/'density_function/elsewhere_inland_legacy.json').read_text())
          assert root['type']=='minecraft:lerp'
          assert root['alpha']==ns+'bamboo_lowland_region'
          assert root['first']['type']=='minecraft:max'
          assert root['first']['right']==ns+'volcanic_relief_density'
          assert root['second']['left']['right']==ns+'volcanic_relief_density'
          volcanic=json.loads((world/'density_function/volcanic_relief_density.json').read_text())
          assert volcanic=={'type':'minecraft:max','left':ns+'volcanic_massif_density','right':ns+'volcanic_mountain_density'}
          bamboo=json.loads((world/'density_function/bamboo_lowland_region.json').read_text())
          assert bamboo['left']['input']['left']['right']==0.18
          assert bamboo['right']['right']['right']['right']['input']['left']['right']==-0.06
          low=root['second']['right']['left']
          assert low['to_coordinate']==106 and low['from_coordinate']==55
          b=json.loads((gen/'worldgen/biome/bamboo_marsh.json').read_text()) if False else json.loads((gen/'biome/bamboo_marsh.json').read_text())
          lakes=b['features'][1]
          assert ns+'bamboo_pools_marsh_placed' in lakes
          assert ns+'bamboo_marsh_wetland_placed' in lakes
          veg=b['features'][9]
          assert ns+'bamboo_grove_marsh_placed' in veg
          assert ns+'wetland_reeds_marsh_placed' in veg
          assert ns+'bamboo_grove_placed' not in veg
          wet=json.loads((gen/'feature/bamboo_marsh_wetland.json').read_text())
          assert wet['type']==ns+'bamboo_marsh_wetland'
          placed=lambda name:json.loads((gen/'placed_feature'/f'{name}_placed.json').read_text())
          assert placed('bamboo_marsh_wetland')['placement'][0]=={'type':'minecraft:count','count':3}
          assert placed('bamboo_grove_marsh')['placement'][0]=={'type':'minecraft:count','count':17}
          assert placed('wetland_reeds_marsh')['placement'][0]=={'type':'minecraft:count','count':7}
          java=Path('src/main/java/net/chickalo/bugsbugsandmorebugs/worldgen/feature/BambooMarshWetlandFeature.java').read_text()
          assert 'safePoolSite' in java and 'level.getBlockState(site.below()).isAir()' in java
          print('Volcanic relief, wetland terrain, marsh ecology and aquifer cap verified')
          PY
      - name: Check forest survival, stone palette and Willow distribution
        run: python3 scripts/check_forest_fixes.py
      - name: Validate original Stone Forest terrain and accessible Snowy Peaks
        run: python3 scripts/check_stone_forest_snowy_peaks.py
      - name: Validate restored Stone Forests and alpine mountain caps
        run: python3 scripts/check_elsewhere_mountains.py
      - name: Validate floating-archipelago wiring
        run: python3 scripts/check_sky_islands.py
      - name: Validate ocean-scale terrain and river-biome alignment
        run: python3 scripts/check_elsewhere_hydrology.py
      - name: Check biome feature-order DAG
        run: python3 scripts/check_biome_feature_order.py
      - name: Validate biome-only alpha contract
        run: python3 scripts/check_biome_alpha.py
      - name: Validate Cave Beetle assets and registration
        run: python3 scripts/check_cave_beetle.py
      - name: Generate datapack and compile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon runDatagen
          ./gradlew --no-daemon build
